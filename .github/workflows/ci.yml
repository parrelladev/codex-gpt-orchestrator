name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run typecheck
      - run: npm.cmd run build
      - run: npm.cmd test
      - run: node --check userscript/ponte-gpt.user.js
